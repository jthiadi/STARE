# Hand-written step catalog: which AR actions belong to which procedure step.
# tools/mine_graph.py adds the prerequisites, subgoals and severities mined from correct
# training recordings and writes industreal_graph.yaml (the file the engine reads).
#
# take:  "take X" actions that signal the worker intends to do this step (used for early warnings)
# do:    actions that perform the step (install, or remove for maintenance)
# done_on: fasten  -> the step completes when the next fastening action ends (nut fitted / tightened)
#          do      -> the step completes when its own "do" action ends
# note:  one plain sentence used in explanations ("why this order")
# extra_requires: prerequisites added by hand on top of the mined ones

fasten_actions: [fit_nut, tighten_nut, fit_acorn_nut, tighten_acorn_nut]

tasks:
  assy:
    title: Assembly
    initial_state: "10000000000"
    # Subgoals in order (from the official procedure_info "expected_before_subgoal" flags):
    # every step of a subgoal must be done before any step of the next one starts.
    subgoals:
      chassis: [front_chassis, front_chassis_pin, rear_chassis, front_rear_chassis_pin, rear_rear_chassis_pin]
      front_and_wheels: [front_bracket, front_bracket_screw, front_wheel_assy, rear_wheel_assy]
    steps:
      front_chassis:
        name: front chassis
        component: front_chassis
        value: 1
        take: [take_short_brace]
        do: [fit_short_brace]
        done_on: fasten
        note: The front chassis is the base everything at the front is mounted on.
      front_chassis_pin:
        name: front chassis pin
        component: front_chassis_pin
        value: 1
        take: [take_pin_short]
        do: [plug_short_pin]
        done_on: fasten
        extra_requires: [front_chassis]   # hand edit: always finished together, so mining cannot see it
        note: This short pin locks the front chassis to the base.
      rear_chassis:
        name: rear chassis (long brace)
        component: rear_chassis
        value: 1
        take: [take_long_brace]
        do: [fit_long_brace]
        done_on: fasten
        note: The assembly uses the long brace at the rear; the short brace is only for maintenance.
      front_rear_chassis_pin:
        name: front pin of the rear chassis
        component: front_rear_chassis_pin
        value: 1
        take: [take_pin_short]
        do: [plug_short_pin]
        done_on: fasten
        note: The pins go through the rear chassis, so the chassis has to be on first.
      rear_rear_chassis_pin:
        name: rear pin of the rear chassis
        component: rear_rear_chassis_pin
        value: 1
        take: [take_pin_short]
        do: [plug_short_pin]
        done_on: fasten
        note: The pins go through the rear chassis, so the chassis has to be on first.
      front_bracket:
        name: front bracket (wing beam)
        component: front_bracket
        value: 1
        take: [take_wing_beam]
        do: [fit_wing_beam]
        done_on: fasten
        note: The front bracket sits on the finished chassis and holds the front wheel axle.
      front_bracket_screw:
        name: front bracket screw
        component: front_bracket_screw
        value: 1
        take: [take_screw_pin]
        do: [plug_screw_pin]
        done_on: fasten
        extra_requires: [front_bracket]   # hand edit: always finished together, so mining cannot see it
        note: The screw goes through the bracket, so the bracket must be in place first.
      front_wheel_assy:
        name: front wheel assembly
        component: front_wheel_assy
        value: 1
        take: [take_pin_long]
        do: [plug_pin_long, fit_wheel]
        done_on: fasten
        note: The front wheels hang on the front bracket's axle (long pin).
      rear_wheel_assy:
        name: rear wheel assembly
        component: rear_wheel_assy
        value: 1
        take: [take_pin_middle, take_pulley]
        do: [plug_pin_middle, fit_pulley, fit_wheel]
        done_on: fasten
        note: The rear wheels and pulley mount on the rear chassis (middle pin).

  main:
    title: Maintenance (swap the rear chassis for the short one)
    initial_state: "11110111111"
    subgoals:
      strip: [remove_rear_wheel_assy, remove_rear_rear_chassis_pin, remove_front_rear_chassis_pin, remove_rear_chassis]
      rebuild: [short_rear_chassis, front_rear_chassis_pin, rear_rear_chassis_pin, rear_wheel_assy]
    steps:
      remove_rear_wheel_assy:
        name: remove the rear wheel assembly
        component: rear_wheel_assy
        value: 0
        do: [pull_pin_middle, pull_wheel]
        done_on: do
        note: The rear wheels block the rear chassis pins.
      remove_rear_rear_chassis_pin:
        name: remove the rear pin of the rear chassis
        component: rear_rear_chassis_pin
        value: 0
        do: [pull_pin_short]
        done_on: do
        note: Both pins must come out before the rear chassis can be lifted off.
      remove_front_rear_chassis_pin:
        name: remove the front pin of the rear chassis
        component: front_rear_chassis_pin
        value: 0
        do: [pull_pin_short]
        done_on: do
        note: Both pins must come out before the rear chassis can be lifted off.
      remove_rear_chassis:
        name: remove the rear chassis (long brace)
        component: rear_chassis
        value: 0
        do: [take_long_brace, put_long_brace]
        done_on: do
        note: The long brace has to come off before the short one can go on.
      short_rear_chassis:
        name: short rear chassis (short brace)
        component: short_rear_chassis
        value: 1
        take: [take_short_brace]
        do: [fit_short_brace]
        done_on: fasten
        note: Maintenance replaces the long rear brace with the short one.
      front_rear_chassis_pin:
        name: front pin of the rear chassis
        component: front_rear_chassis_pin
        value: 1
        take: [take_pin_short]
        do: [plug_short_pin]
        done_on: fasten
        note: The pins go through the new rear chassis, so it has to be on first.
      rear_rear_chassis_pin:
        name: rear pin of the rear chassis
        component: rear_rear_chassis_pin
        value: 1
        take: [take_pin_short]
        do: [plug_short_pin]
        done_on: fasten
        note: The pins go through the new rear chassis, so it has to be on first.
      rear_wheel_assy:
        name: rear wheel assembly
        component: rear_wheel_assy
        value: 1
        take: [take_pin_middle, take_pulley]
        do: [plug_pin_middle, fit_pulley, fit_wheel]
        done_on: fasten
        extra_requires: [rear_rear_chassis_pin]   # hand edit: physically after both pins (1 of 16 runs annotated otherwise)
        note: The rear wheels and pulley go back on once the new rear chassis and its pins are in.
